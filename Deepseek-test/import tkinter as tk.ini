import tkinter as tk

def on_button_click():
    label.config(text="按钮已点击！")

# 创建主窗口
root = tk.Tk()
root.title("简单GUI")

# 创建一个标签
label = tk.Label(root, text="Hello, Tkinter!")
label.pack(pady=10)

# 创建一个按钮
button = tk.Button(root, text="点击我", command=on_button_click)
button.pack(pady=10)

# 运行主事件循环
root.mainloop()